workflows:
  ios-workflow:
    name: AthleteHub iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.athletehub.app"
        CERT_PASSWORD: "Miapassword123!"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installa dipendenze
        script: |
          npm install
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Imposta Bundle ID
        script: |
          plutil -replace PRODUCT_BUNDLE_IDENTIFIER -string "$BUNDLE_ID" ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Installa CocoaPods (se presente)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi
      - name: Configura Certificato e Profilo
        script: |
          cd $CM_BUILD_DIR
          
          # 1. Prepara e installa il certificato con chiave privata nel keychain di login
          KEYCHAIN_PATH="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "" "$KEYCHAIN_PATH" || true
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          
          openssl x509 -inform DER -in distribution.cer.cer -out distribution.pem
          openssl pkcs12 -export -out certificate.p12 -inkey private_key.key -in distribution.pem -passout pass:$CERT_PASSWORD
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" || true
          
          # Verifica identità disponibili
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          
          # 2. Installa il file AthleteHub.mobileprovision dalla cartella ios/
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract TeamIdentifier.0 raw -)
          cp ios/AthleteHub.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          
          # 3. Configura firma manuale, Team ID, Identità e Profilo direttamente nel progetto Xcode
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = .*/\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Compila e impacchetta App iOS (.ipa)
        script: |
          cd $CM_BUILD_DIR
          mkdir -p build/ios/ipa
          
          UUID=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i ios/AthleteHub.mobileprovision | plutil -extract TeamIdentifier.0 raw -)
          
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/App.xcarchive"
          
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild archive -workspace "ios/App/App.xcworkspace" -scheme "App" -configuration Release -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$UUID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$TEAM_ID" | grep -E "error:|warning:|ARCHIVE|Signing" || true
          else
            xcodebuild archive -project "ios/App/App.xcodeproj" -scheme "App" -configuration Release -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$UUID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$TEAM_ID" | grep -E "error:|warning:|ARCHIVE|Signing" || true
          fi
          
          test -d "$ARCHIVE_PATH" || exit 1
          
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist /Users/builder/export_options.plist -exportPath "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
