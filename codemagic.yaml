workflows:
  ios-workflow:
    name: Genera Chiavi Apple
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Genera chiave privata e CSR
        script: |
          openssl genrsa -out private_key.key 2048
          openssl req -new -key private_key.key -out CertificateSigningRequest.certSigningRequest -subj "/CN=AthleteHub/C=IT"
    artifacts:
      - private_key.key
      - CertificateSigningRequest.certSigningRequest
