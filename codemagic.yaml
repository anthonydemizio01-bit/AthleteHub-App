workflows:
  ios-workflow:
    name: AthleteHub iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.athletehub.app"
        CERT_PASSWORD: "Miapassword123!"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installa dipendenze
        script: |
          npm install
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Imposta Bundle ID
        script: |
          plutil -replace PRODUCT_BUNDLE_IDENTIFIER -string "$BUNDLE_ID" ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Installa CocoaPods (se presente)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi
      - name: Configura Certificato e Profilo
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          CER_FILE=$(find . -maxdepth 2 -name "distribution.cer*" | head -n 1)
          KEY_FILE=$(find . -maxdepth 2 -name "private_key.key" | head -n 1)

          echo "Certificato trovato: $CER_FILE"
          echo "Chiave privata trovata: $KEY_FILE"

          if [ -z "$CER_FILE" ] || [ -z "$KEY_FILE" ]; then
            echo "ERRORE: Manca distribution.cer o private_key.key!"
            exit 1
          fi

          openssl x509 -inform DER -in "$CER_FILE" -out distribution.pem 2>/dev/null || cp "$CER_FILE" distribution.pem

          CERT_PUB=$(openssl x509 -in distribution.pem -pubkey -noout | openssl md5)
          KEY_PUB=$(openssl pkey -in "$KEY_FILE" -pubout | openssl md5)

          echo "MD5 chiave pubblica certificato: $CERT_PUB"
          echo "MD5 chiave pubblica private_key: $KEY_PUB"

          if [ "$CERT_PUB" != "$KEY_PUB" ]; then
            echo "ERRORE: private_key.key NON appartiene a questo distribution.cer!"
            exit 1
          fi

          rm -f certificate.p12
          openssl pkcs12 -export -out certificate.p12 -inkey "$KEY_FILE" -in distribution.pem -passout "pass:$CERT_PASSWORD" -legacy 2>/dev/null || \
          openssl pkcs12 -export -out certificate.p12 -inkey "$KEY_FILE" -in distribution.pem -passout "pass:$CERT_PASSWORD"

          keychain initialize
          KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | xargs)
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" || true
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)
          cp "ios/AthleteHub.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = .*/\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Compila e impacchetta App iOS (.ipa)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p build/ios/ipa

          BUILD_NUM=${PROJECT_BUILD_NUMBER:-2}
          if [ "$BUILD_NUM" -le 1 ]; then
            BUILD_NUM=2
          fi
          echo "Uso numero di build iOS: $BUILD_NUM"

          KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | xargs)
          CERT_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eo '[0-9A-F]{40}' | head -n 1)
          UUID=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i "ios/AthleteHub.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)

          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingCertificate</key>
              <string>$CERT_HASH</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/App.xcarchive"

          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild archive -workspace "ios/App/App.xcworkspace" -scheme "App" -configuration Release -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" CURRENT_PROJECT_VERSION="$BUILD_NUM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$CERT_HASH" PROVISIONING_PROFILE="$UUID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$TEAM_ID"
          else
            xcodebuild archive -project "ios/App/App.xcodeproj" -scheme "App" -configuration Release -destination "generic/platform=iOS" -archivePath "$ARCHIVE_PATH" CURRENT_PROJECT_VERSION="$BUILD_NUM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$CERT_HASH" PROVISIONING_PROFILE="$UUID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" DEVELOPMENT_TEAM="$TEAM_ID"
          fi

          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist /Users/builder/export_options.plist -exportPath "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: |
