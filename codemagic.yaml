workflows:
  ios-workflow:
    name: AthleteHub iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installa dipendenze
        script: |
          npm install
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Compila App iOS (senza firma per test)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install && cd ../..
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build
          fi
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
