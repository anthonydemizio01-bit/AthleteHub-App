workflows:
  ios-workflow:
    name: AthleteHub iOS Build
    integrations:
      app_store_connect: ChiaveApple
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.athletehub.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installa dipendenze
        script: |
          npm install
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Installa CocoaPods (se presente)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi
      - name: Scarica o crea certificato e profilo Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compila e impacchetta App iOS (.ipa)
        script: |
          if [ -f "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
