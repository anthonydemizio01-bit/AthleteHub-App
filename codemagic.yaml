workflows:
  ios-workflow:
    name: AthleteHub iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.athletehub.app"
        CERT_PASSWORD: "Miapassword123!"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installa dipendenze
        script: |
          npm install
      - name: Sincronizza Capacitor iOS
        script: |
          npx cap sync ios
      - name: Imposta Bundle ID e Firma Automatica
        script: |
          plutil -replace PRODUCT_BUNDLE_IDENTIFIER -string "$BUNDLE_ID" ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Installa CocoaPods (se presente)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi
      - name: Crea certificato .p12 e configura Keychain
        script: |
          cd $CM_BUILD_DIR
          
          openssl x509 -inform DER -in distribution.cer.cer -out distribution.pem
          openssl pkcs12 -export -out certificate.p12 -inkey private_key.key -in distribution.pem -passout pass:$CERT_PASSWORD
          
          keychain initialize
          KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | xargs)
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" || true
      - name: Compila e impacchetta App iOS (.ipa)
        script: |
          cd $CM_BUILD_DIR
          
          # Genera il file export_options.plist in formato XML valido
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App" --export-options-plist /Users/builder/export_options.plist
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App" --export-options-plist /Users/builder/export_options.plist
          fi
    artifacts:
      - build/ios/ipa/*.ipa
