<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AthleteHub — Il tuo registro gare multisport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }
    button, input, select, textarea {
      touch-action: manipulation;
      pointer-events: auto;
    }
    button { cursor: pointer; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- SCHERMATA ACCESSO / REGISTRAZIONE -->
  <div id="auth-screen" class="min-h-screen flex flex-col justify-center p-4 pt-12 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/30 via-zinc-950 to-zinc-950">
    <div class="max-w-md w-full mx-auto bg-zinc-900/95 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black text-white">Athlete<span class="text-emerald-400">Hub</span></h1>
        <p class="text-xs text-zinc-400">HYROX • DEKA • Deadly Dozen • Spartan • IRONMAN • Maratone • StraMilano</p>
      </div>

      <div class="grid grid-cols-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button type="button" id="tab-login" class="py-2.5 rounded-lg text-xs font-bold bg-zinc-800 text-white">Accedi</button>
        <button type="button" id="tab-register" class="py-2.5 rounded-lg text-xs font-bold text-zinc-400">Crea Account</button>
      </div>

      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email</label>
          <input type="email" id="login-email" autocomplete="email" placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="login-msg" class="text-xs text-amber-400 hidden"></p>
        <button type="submit" id="btn-login-submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 active:bg-emerald-400 text-zinc-950">
          Entra in AthleteHub →
        </button>
      </form>

      <form id="register-form" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome e Cognome</label>
          <input type="text" id="reg-name" placeholder="es. Marco Rossi" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email</label>
          <input type="email" id="reg-email" autocomplete="email" placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password (min. 6 caratteri)</label>
          <input type="password" id="reg-password" autocomplete="new-password" placeholder="Crea una password" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="reg-msg" class="text-xs hidden"></p>
        <button type="submit" id="btn-register-submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 active:bg-emerald-400 text-zinc-950">
          Crea Account
        </button>
      </form>

      <button type="button" id="btn-demo" class="w-full py-3 rounded-xl text-xs font-bold bg-zinc-950 border border-zinc-700 text-zinc-200 active:bg-zinc-800">
        🚀 Prova Subito (Modalità Demo)
      </button>
    </div>
  </div>

  <!-- APP PRINCIPALE -->
  <div id="app-screen" class="hidden min-h-screen flex-col">
    <header class="border-b border-zinc-800 bg-zinc-950/95 backdrop-blur sticky top-0 z-30 pt-9 sm:pt-0">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-16 py-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
            <span class="text-lg font-black text-zinc-950">AH</span>
          </div>
          <div>
            <span class="text-xl font-black tracking-tight text-white">Athlete<span class="text-emerald-400">Hub</span></span>
            <p id="athlete-label" class="text-[11px] text-zinc-400">Registro Gare & Competizioni Multisport</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2.5 flex-wrap">
          <button type="button" id="btn-export" class="px-2.5 py-2 text-xs font-semibold rounded-lg bg-zinc-900 active:bg-zinc-800 text-zinc-300 border border-zinc-800">
            ⬇️ Esporta
          </button>
          <label class="px-2.5 py-2 text-xs font-semibold rounded-lg bg-zinc-900 active:bg-zinc-800 text-zinc-300 border border-zinc-800 cursor-pointer">
            <span>⬆️ Importa</span>
            <input type="file" id="input-import" accept=".json" class="hidden" />
          </label>
          <button type="button" id="btn-open-new" class="px-3.5 py-2 text-xs sm:text-sm font-bold rounded-lg bg-emerald-500 active:bg-emerald-400 text-zinc-950 shadow-lg shadow-emerald-500/20">
            + Registra Gara
          </button>
          <button type="button" id="btn-logout" class="px-2.5 py-2 text-xs font-bold rounded-lg bg-zinc-900 text-red-400 border border-zinc-800 active:bg-zinc-800">
            Esci
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
      <section id="kpi-container" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></section>

      <section class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800/80">
        <div id="sport-filters" class="flex flex-wrap gap-2"></div>
        <div class="w-full md:w-72 relative">
          <input type="text" id="search-input" placeholder="Cerca gara, città, note..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500" />
        </div>
      </section>

      <section id="races-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>
    </main>
  </div>

  <!-- MODAL: NUOVA GARA -->
  <div id="new-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden items-start justify-center p-4 pt-10 overflow-y-auto">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full p-6 space-y-5 my-6 shadow-2xl">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
        <h2 class="text-xl font-extrabold text-white">Registra Nuova Competizione</h2>
        <button type="button" id="btn-close-new" class="text-zinc-400 active:text-white text-2xl font-bold px-2">&times;</button>
      </div>

      <form id="race-form" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Disciplina / Competizione</label>
            <select id="form-sport" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="HYROX">⚡ HYROX</option>
              <option value="DEKA">🔥 DEKA</option>
              <option value="DEADLY_DOZEN">💀 Deadly Dozen</option>
              <option value="SPARTAN">🛡️ Spartan Race</option>
              <option value="IRONMAN_FULL">🏊‍♂️ IRONMAN (Full)</option>
              <option value="IRONMAN_703">🚴‍♂️ Mezzo IRONMAN (70.3)</option>
              <option value="TRIATHLON">🏅 Triathlon</option>
              <option value="MARATHON">🏃‍♂️ Maratone</option>
              <option value="STRAMILANO">🌆 StraMilano</option>
              <option value="RUNNING">🏃 Corsa / Gara Generica</option>
              <option value="ROWING">🚣 Vogatore / Indoor Rowing</option>
              <option value="POWERLIFTING">🏋️ Powerlifting</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Gara / Evento specifico</label>
            <select id="form-preset" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"></select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome Evento / Gara (scrivi qui se non esiste o vuoi personalizzarlo)</label>
          <input type="text" id="form-title" placeholder="Scrivi qui il nome della gara..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Data *</label>
            <input type="date" id="form-date" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Luogo / Città</label>
            <input type="text" id="form-location" placeholder="es. Milano, Italia" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Categoria / Divisione</label>
            <input type="text" id="form-category" placeholder="es. Men Open / Age Group" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-zinc-950/60 p-4 rounded-xl border border-zinc-800/80">
          <div>
            <label class="block text-xs font-semibold text-emerald-400 mb-1">Risultato / Tempo Finale *</label>
            <input type="text" id="form-result" required placeholder="es. 01:09:15 / 09:45:12" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm font-bold text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Posizione Classifica</label>
            <input type="number" id="form-rank" placeholder="es. 1" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Totale Partecipanti</label>
            <input type="number" id="form-total" placeholder="es. 120" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div id="dynamic-fields-container" class="space-y-3 bg-zinc-950/40 p-4 rounded-xl border border-zinc-800"></div>

        <div class="flex items-center gap-3">
          <input type="checkbox" id="form-pb" class="w-4 h-4 accent-emerald-500 rounded" />
          <label for="form-pb" class="text-sm font-semibold text-amber-400 cursor-pointer">🏆 Segna come Personal Best (PR)</label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Note, sensazioni e strategia</label>
          <textarea id="form-notes" rows="2" placeholder="Come ti sei sentito? Cosa migliorare alla prossima gara?" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-emerald-500 focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2 border-t border-zinc-800">
          <button type="button" id="btn-cancel-new" class="px-4 py-2 rounded-xl text-sm font-semibold text-zinc-400 active:text-white">Annulla</button>
          <button type="submit" class="px-6 py-2 rounded-xl text-sm font-bold bg-emerald-500 active:bg-emerald-400 text-zinc-950 shadow-lg shadow-emerald-500/20">Salva Gara</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: DETTAGLIO & FINISHER CARD -->

    <div id="detail-content" class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-2xl w-full p-6 space-y-6 my-6 shadow-2xl"></div>

    function storageKey() {
      return 'athletehub_races_v3_' + currentUserKey;

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = String(dateStr).split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function loadRaces() {
      try {
        const raw = localStorage.getItem(storageKey());
        races = raw ? JSON.parse(raw) : DEFAULT_RACES.slice();
      } catch (e) {
        races = DEFAULT_RACES.slice();
      }
      renderKPIs();
      renderFilters();
      renderRaces();
    }

    function saveToStorage() {
      try {
        localStorage.setItem(storageKey(), JSON.stringify(races));
      } catch (e) {}
    }

    function openApp(labelText, userKey) {
      currentUserKey = userKey || 'demo';
      document.getElementById('athlete-label').textContent = `${labelText} • Registro Gare & Competizioni Multisport`;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('flex');
      loadRaces();
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.className = 'py-2.5 rounded-lg text-xs font-bold bg-zinc-800 text-white';
        tabRegister.className = 'py-2.5 rounded-lg text-xs font-bold text-zinc-400';
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabRegister.className = 'py-2.5 rounded-lg text-xs font-bold bg-zinc-800 text-white';
        tabLogin.className = 'py-2.5 rounded-lg text-xs font-bold text-zinc-400';
      }
    }

    async function handleLoginAction(e) {
      if (e && e.preventDefault) e.preventDefault();
      const msg = document.getElementById('login-msg');
      const email = (document.getElementById('login-email').value || '').trim();
      const password = document.getElementById('login-password').value || '';

      if (!email) {
        openApp('Atleta', 'local_athlete');
        return;
      }

      if (sb && password) {
        try {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (!error && data && data.user) {
            const fullName = (data.user.user_metadata && data.user.user_metadata.full_name) || email;
            openApp(fullName, data.user.id);
            return;
          }
          if (error) {
            msg.textContent = 'Accesso locale attivato (' + error.message + ').';
            msg.classList.remove('hidden');
          }
        } catch (err) {
          msg.textContent = 'Accesso locale attivato.';
          msg.classList.remove('hidden');
        }
      }

      openApp(email, email);
    }

    async function handleRegisterAction(e) {
      if (e && e.preventDefault) e.preventDefault();
      const msg = document.getElementById('reg-msg');
      const name = (document.getElementById('reg-name').value || '').trim();
      const email = (document.getElementById('reg-email').value || '').trim();
      const password = document.getElementById('reg-password').value || '';

      msg.className = 'text-xs text-emerald-400';
      msg.textContent = 'Account pronto, ingresso in corso...';
      msg.classList.remove('hidden');

      if (sb && email && password.length >= 6) {
        try {
          await sb.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
          });
        } catch (err) {}
      }

      openApp(name || email || 'Atleta', email || name || 'local_athlete');
    }

      try { if (sb) await sb.auth.signOut(); } catch (e) {}

      const kpis = [
        { label: 'Gare Disputate', value: totalRaces, sub: 'Totale storico', icon: '🏁', color: 'text-white' },
        { label: 'Podi (Top 3)', value: podiums, sub: 'Medaglie conquistate', icon: '🥇', color: 'text-amber-400' },

        return `

            active
              ? 'bg-emerald-500 text-zinc-950 shadow-md shadow-emerald-500/20'

      }).join('');

      el.querySelectorAll('.filter-btn').forEach(btn => {

      presetSel.innerHTML = opts.map(o => `<option value="${escapeAttr(o)}">${escapeHtml(o)}</option>`).join('');
      updateCustomNamePlaceholder();

    function updateCustomNamePlaceholder() {
      const sport = document.getElementById('form-sport').value;

      if (sport === 'RUNNING' || preset.toLowerCase().includes('scrivi')) {
        titleInput.placeholder = 'Scrivi qui il nome della gara (se non è in elenco)...';
      } else {
        titleInput.placeholder = `Opzionale: nome specifico o dettaglio (${preset})`;

    function saveRace(e) {
      if (e && e.preventDefault) e.preventDefault();
      const sport = document.getElementById('form-sport').value;
      const preset = document.getElementById('form-preset').value;
      const customTitle = (document.getElementById('form-title').value || '').trim();
      const isWritePreset = preset.toLowerCase().includes('scrivi');
      const finalTitle = customTitle || (!isWritePreset ? preset : SPORT_CONFIG[sport].label);

      const details = {};
      document.querySelectorAll('.detail-input').forEach(inp => {
        if (inp.value.trim()) {
          details[inp.dataset.detailKey] = inp.value.trim();
        }
      });
      document.querySelectorAll('.extra-station-row').forEach(row => {
        const k = (row.querySelector('.extra-key')?.value || '').trim();
        const v = (row.querySelector('.extra-val')?.value || '').trim();
        if (k || v) {
          details[k || 'Split'] = v || '-';
        }
      });

      const newRace = {
        id: Date.now().toString(),
        sport,
        title: finalTitle,
        date: document.getElementById('form-date').value,
        location: (document.getElementById('form-location').value || '').trim(),
        category: (document.getElementById('form-category').value || '').trim(),
        result: (document.getElementById('form-result').value || '').trim(),
        rank: parseInt(document.getElementById('form-rank').value, 10) || null,
        total: parseInt(document.getElementById('form-total').value, 10) || null,
        pb: document.getElementById('form-pb').checked,
        notes: (document.getElementById('form-notes').value || '').trim(),
        details
      };

      races.unshift(newRace);
      saveToStorage();
      closeNewModal();
      renderKPIs();
      renderRaces();
    }

                <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3">
                  <p class="text-[11px] text-zinc-500">${escapeHtml(k)}</p>
                  <p class="text-sm font-bold text-white mt-0.5">${escapeHtml(v)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${r.notes ? `
          <div class="bg-zinc-950/60 border border-zinc-800 rounded-xl p-4">
            <p class="text-xs font-bold text-zinc-400 mb-1">📝 Note Gara</p>
            <p class="text-sm text-zinc-300 leading-relaxed">${escapeHtml(r.notes)}</p>
          </div>
        ` : ''}

        <div class="flex justify-between items-center pt-3 border-t border-zinc-800">
          <button type="button" id="btn-delete-race" class="text-xs font-bold text-red-400 active:text-red-300">🗑️ Elimina Gara</button>
          <button type="button" id="btn-close-detail" class="px-5 py-2 rounded-xl text-sm font-bold bg-zinc-800 active:bg-zinc-700 text-white">Chiudi</button>
        </div>
      `;

      document.getElementById('btn-close-detail-x').addEventListener('click', closeDetailModal);
      document.getElementById('btn-close-detail').addEventListener('click', closeDetailModal);
      document.getElementById('btn-delete-race').addEventListener('click', () => {
        races = races.filter(item => item.id !== r.id);
        saveToStorage();
        closeDetailModal();
        renderKPIs();
        renderRaces();
      });

      document.getElementById('detail-modal').classList.remove('hidden');
      document.getElementById('detail-modal').classList.add('flex');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.getElementById('detail-modal').classList.remove('flex');
    }

    function exportData() {
      const dataStr = JSON.stringify(races, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AthleteHub_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            races = imported;
            saveToStorage();
            renderKPIs();
            renderRaces();
          }
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    // Event bindings diretti
    document.getElementById('tab-login').addEventListener('click', () => switchAuthTab('login'));
    document.getElementById('tab-register').addEventListener('click', () => switchAuthTab('register'));
    document.getElementById('login-form').addEventListener('submit', handleLoginAction);
    document.getElementById('btn-login-submit').addEventListener('click', handleLoginAction);
    document.getElementById('register-form').addEventListener('submit', handleRegisterAction);
    document.getElementById('btn-register-submit').addEventListener('click', handleRegisterAction);
    document.getElementById('btn-demo').addEventListener('click', enterDemoMode);

    document.getElementById('btn-open-new').addEventListener('click', openNewModal);
    document.getElementById('btn-close-new').addEventListener('click', closeNewModal);
    document.getElementById('btn-cancel-new').addEventListener('click', closeNewModal);
    document.getElementById('race-form').addEventListener('submit', saveRace);
    document.getElementById('btn-logout').addEventListener('click', handleLogout);
    document.getElementById('btn-export').addEventListener('click', exportData);
    document.getElementById('input-import').addEventListener('change', importData);
    document.getElementById('search-input').addEventListener('input', renderRaces);
    document.getElementById('form-sport').addEventListener('change', () => {
      syncPresetSelect();
      renderDynamicFields();
    });
    document.getElementById('form-preset').addEventListener('change', updateCustomNamePlaceholder);
  </script>
</body>
</html>
