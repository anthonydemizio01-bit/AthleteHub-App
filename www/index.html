<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AthleteHub — Registro Gare & Competizioni</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      touch-action: manipulation;
    }
    button { cursor: pointer; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- SCHERMATA ACCESSO / REGISTRAZIONE -->
  <div id="auth-screen" class="min-h-screen flex flex-col justify-center p-4 pt-12 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/30 via-zinc-950 to-zinc-950">
    <div class="max-w-md w-full mx-auto bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black text-white">Athlete<span class="text-emerald-400">Hub</span></h1>
        <p class="text-xs text-zinc-400">HYROX • DEKA • Spartan Race • Triathlon • Ironman • Maratone • StraMilano</p>
      </div>

      <div class="grid grid-cols-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button type="button" id="tab-login" class="py-2 rounded-lg text-xs font-bold bg-zinc-800 text-white">Accedi</button>
        <button type="button" id="tab-register" class="py-2 rounded-lg text-xs font-bold text-zinc-400">Crea Account</button>
      </div>

      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email</label>
          <input type="email" id="login-email" required placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="login-msg" class="text-xs text-red-400 hidden"></p>
        <button type="submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 active:bg-emerald-400 text-zinc-950">
          Entra in AthleteHub →
        </button>
      </form>

      <form id="register-form" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome e Cognome</label>
          <input type="text" id="reg-name" required placeholder="es. Marco Rossi" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email</label>
          <input type="email" id="reg-email" required placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password (min. 6 caratteri)</label>
          <input type="password" id="reg-password" minlength="6" required placeholder="Crea una password" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="reg-msg" class="text-xs hidden"></p>
        <button type="submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 active:bg-emerald-400 text-zinc-950">
          Crea Account
        </button>
      </form>

      <button type="button" id="btn-demo" class="w-full py-2.5 rounded-xl text-xs font-bold bg-zinc-950 border border-zinc-800 text-zinc-300">
        🚀 Prova Subito (Modalità Demo)
      </button>
    </div>
  </div>

  <!-- APP PRINCIPALE -->
  <div id="app-screen" class="hidden min-h-screen flex-col pt-12 pb-10">
    <header class="border-b border-zinc-800 bg-zinc-950/90 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
      <div>
        <span class="text-lg font-black text-white">Athlete<span class="text-emerald-400">Hub</span></span>
        <p id="athlete-label" class="text-[11px] text-zinc-400">Atleta</p>
      </div>
      <button type="button" id="btn-logout" class="px-3 py-1.5 text-xs font-bold bg-zinc-900 text-red-400 rounded-lg border border-zinc-800">
        Esci
      </button>
    </header>

    <main class="p-4 max-w-2xl mx-auto w-full space-y-6">
      <!-- RIEPILOGO -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
          <p class="text-xs text-zinc-400">Gare registrate</p>
          <p id="stat-races" class="text-2xl font-black text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
          <p class="text-xs text-zinc-400">Km totali</p>
          <p id="stat-km" class="text-2xl font-black text-white mt-1">0</p>
        </div>
      </div>

      <!-- FORM NUOVA GARA -->
      <form id="race-form" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
        <h2 class="text-base font-extrabold text-white">+ Carica nuova gara o competizione</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Categoria / Competizione *</label>
            <select id="race-category" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none">
              <option value="HYROX">HYROX</option>
              <option value="DEKA">DEKA</option>
              <option value="Spartan Race">Spartan Race</option>
              <option value="Triathlon">Triathlon</option>
              <option value="IRONMAN (Full)">IRONMAN (Full)</option>
              <option value="Mezzo IRONMAN (70.3)">Mezzo IRONMAN (70.3)</option>
              <option value="Maratone">Maratone</option>
              <option value="StraMilano">StraMilano</option>
              <option value="Gara di corsa generica">Gara di corsa generica</option>
              <option value="Altra gara / Competizione">Altra gara / Competizione</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Gara / Evento specifico *</label>
            <select id="race-preset" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none"></select>
          </div>
        </div>

        <div>
          <label id="custom-name-label" class="block text-xs font-semibold text-zinc-400 mb-1">Nome gara / Evento (scrivi qui se non esiste o vuoi personalizzarlo)</label>
          <input type="text" id="race-custom-name" placeholder="Es. Milano Marathon, Maratona di Roma, Corsa campestre locale..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Data *</label>
            <input type="date" id="race-date" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Distanza (km)</label>
            <input type="number" step="0.1" min="0" id="race-km" placeholder="es. 42.2 / 10 / 8.0" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Tempo totale / Risultato</label>
            <input type="text" id="race-time" placeholder="es. 01:14:50" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Categoria / Note</label>
            <input type="text" id="race-notes" placeholder="es. Age Group, Pro, Doubles..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
          </div>
        </div>

        <!-- TEMPI DELLE STAZIONI / SPLIT -->
        <div class="bg-zinc-950/80 border border-zinc-800 rounded-xl p-3 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <label class="block text-xs font-bold text-emerald-400">Tempi stazioni / split</label>
            <button type="button" id="btn-add-station" class="px-2.5 py-1 text-xs font-bold bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-zinc-700 rounded-lg">
              + Aggiungi stazione
            </button>
          </div>

          <div id="station-rows" class="space-y-2">
            <div class="grid grid-cols-12 gap-2 station-row items-center">
              <input type="text" placeholder="Stazione / Split (es. SkiErg, T1, 10km)" class="col-span-7 station-name bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
              <input type="text" placeholder="Tempo (es. 04:12)" class="col-span-5 station-time bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
            </div>
          </div>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 active:bg-emerald-400 text-zinc-950">
          Salva Gara
        </button>
      </form>

      <!-- ELENCO GARE -->
      <div class="space-y-3">
        <h2 class="text-base font-extrabold text-white">Le tue gare</h2>
        <div id="race-list" class="space-y-2.5">
          <p class="text-xs text-zinc-500">Nessuna gara ancora caricata. Compila il modulo qui sopra per aggiungere la prima.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://syddlnewhenkofwwhimm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5ZGRsbmV3aGVua29md3doaW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4OTg0ODYsImV4cCI6MjExMDQ3NDQ4Nn0.F1SXOSCxbLlcpHZUiz30HcG0QShYJcuwP3KQaDPwZss';

    let sb = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {}

    const PRESETS_BY_CATEGORY = {
      'HYROX': [
        'HYROX Singles',
        'HYROX Doubles',
        'HYROX Pro',
        'HYROX Relay',
        'Altra gara HYROX (scrivi sotto)'
      ],
      'DEKA': [
        'DEKA FIT',
        'DEKA STRONG',
        'DEKA MILE',
        'Altra gara DEKA (scrivi sotto)'
      ],
      'Spartan Race': [
        'Spartan Sprint (5 km)',
        'Spartan Super (10 km)',
        'Spartan Beast (21 km)',
        'Spartan Ultra (50 km)',
        'Spartan Stadion / Trifecta',
        'Altra Spartan Race (scrivi sotto)'
      ],
      'Triathlon': [
        'Triathlon Sprint',
        'Triathlon Olimpico',
        'Triathlon Medio / Lungo',
        'Altro Triathlon (scrivi sotto)'
      ],
      'IRONMAN (Full)': [
        'IRONMAN Full Distance (226 km)',
        'IRONMAN Emilia-Romagna',
        'Altro IRONMAN Full (scrivi sotto)'
      ],
      'Mezzo IRONMAN (70.3)': [
        'IRONMAN 70.3 (113 km)',
        'IRONMAN 70.3 Venezia-Jesolo',
        'Altro Mezzo IRONMAN 70.3 (scrivi sotto)'
      ],
      'Maratone': [
        'Milano Marathon',
        'Maratona di Roma',
        'Maratona di Firenze',
        'Maratona di Venezia',
        'Berlin Marathon',
        'London Marathon',
        'New York City Marathon',
        'Chicago Marathon',
        'Tokyo Marathon',
        'Boston Marathon',
        'Valencia Marathon',
        'Altra Maratona (scrivi sotto)'
      ],
      'StraMilano': [
        'StraMilano 10 km',
        'StraMilano Half Marathon (21.097 km)',
        'StraMilano 5 km',
        'Altra edizione StraMilano (scrivi sotto)'
      ],
      'Gara di corsa generica': [
        'Gara di corsa su strada',
        'Trail / Corsa in montagna',
        'Corsa campestre / 10K / 5K',
        'Gara non in elenco (scrivi nome sotto)'
      ],
      'Altra gara / Competizione': [
        'Inserisci nome gara o competizione sotto'
      ]
    };

    let currentUserKey = 'demo';
    let races = [];

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const categorySelect = document.getElementById('race-category');
    const presetSelect = document.getElementById('race-preset');
    const customNameInput = document.getElementById('race-custom-name');
    const stationRowsEl = document.getElementById('station-rows');

    function syncPresetOptions() {
      const cat = categorySelect.value;
      const options = PRESETS_BY_CATEGORY[cat] || ['Altra gara (scrivi nome sotto)'];
      presetSelect.innerHTML = options.map(opt =>
        `<option value="${escapeAttr(opt)}">${escapeHtml(opt)}</option>`
      ).join('');
      updateCustomNamePlaceholder();
    }

    function updateCustomNamePlaceholder() {
      const cat = categorySelect.value;
      const preset = presetSelect.value;
      if (cat === 'Gara di corsa generica' || preset.toLowerCase().includes('scrivi') || preset.toLowerCase().includes('inserisci')) {
        customNameInput.placeholder = 'Scrivi qui il nome della gara (es. Corsa di Monza, Gara locale...)';
      } else {
        customNameInput.placeholder = `Opzionale: aggiungi dettaglio o nome specifico (${preset})`;
      }
    }

    function storageKey() {
      return 'athletehub_races_' + currentUserKey;
    }

    function addStationRow(nameVal = '', timeVal = '') {
      const row = document.createElement('div');
      row.className = 'grid grid-cols-12 gap-2 station-row items-center';
      row.innerHTML = `
        <input type="text" value="${escapeAttr(nameVal)}" placeholder="Stazione / Split (es. Sled Push, Bike)" class="col-span-6 station-name bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        <input type="text" value="${escapeAttr(timeVal)}" placeholder="Tempo (03:45)" class="col-span-4 station-time bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        <button type="button" class="col-span-2 btn-remove-station py-2 text-xs font-bold text-red-400 bg-zinc-900 border border-zinc-800 rounded-lg">✕</button>
      `;
      row.querySelector('.btn-remove-station').addEventListener('click', () => {
        row.remove();
      });
      stationRowsEl.appendChild(row);
    }

    function resetStationRows() {
      stationRowsEl.innerHTML = `
        <div class="grid grid-cols-12 gap-2 station-row items-center">
          <input type="text" placeholder="Stazione / Split (es. SkiErg, T1, 10km)" class="col-span-7 station-name bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
          <input type="text" placeholder="Tempo (es. 04:12)" class="col-span-5 station-time bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        </div>
      `;
    }

    function collectStations() {
      const items = [];
      stationRowsEl.querySelectorAll('.station-row').forEach(row => {
        const name = (row.querySelector('.station-name')?.value || '').trim();
        const time = (row.querySelector('.station-time')?.value || '').trim();
        if (name || time) {
          items.push({ name: name || 'Stazione', time: time || '-' });
        }
      });
      return items;
    }

    function loadRaces() {
      try {
        const raw = localStorage.getItem(storageKey());
        races = raw ? JSON.parse(raw) : [];
      } catch (e) {
        races = [];
      }
      renderRaces();
    }

    function saveRaces() {
      try {
        localStorage.setItem(storageKey(), JSON.stringify(races));
      } catch (e) {}
      renderRaces();
    }

    function renderRaces() {
      const listEl = document.getElementById('race-list');
      const countEl = document.getElementById('stat-races');
      const kmEl = document.getElementById('stat-km');

      countEl.textContent = String(races.length);
      const totalKm = races.reduce((acc, r) => acc + (parseFloat(r.km) || 0), 0);
      kmEl.textContent = totalKm.toFixed(1).replace(/\.0$/, '');

      if (!races.length) {
        listEl.innerHTML = '<p class="text-xs text-zinc-500">Nessuna gara ancora caricata. Compila il modulo qui sopra per aggiungere la prima.</p>';
        return;
      }

      listEl.innerHTML = races.map((r, idx) => {
        const stationsHtml = Array.isArray(r.stations) && r.stations.length
          ? `<div class="mt-2 pt-2 border-t border-zinc-800/80 flex flex-wrap gap-1.5">
              ${r.stations.map(s => `
                <span class="text-[11px] px-2 py-0.5 rounded-md bg-zinc-950 border border-zinc-800 text-zinc-300">
                  <strong class="text-emerald-400">${escapeHtml(s.name)}:</strong> ${escapeHtml(s.time)}
                </span>
              `).join('')}
            </div>`
          : '';

        return `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex justify-between items-start gap-3">
            <div class="space-y-1 min-w-0 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400">${escapeHtml(r.category || r.sport || 'Gara')}</span>
                <span class="text-xs text-zinc-400">${escapeHtml(r.date || '')}</span>
                ${r.km ? `<span class="text-xs font-semibold text-zinc-300">${escapeHtml(r.km)} km</span>` : ''}
                ${r.time ? `<span class="text-xs font-semibold text-zinc-300">• ${escapeHtml(r.time)}</span>` : ''}
              </div>
              <p class="text-sm font-bold text-white">${escapeHtml(r.title)}</p>
              ${r.notes ? `<p class="text-xs text-zinc-400">${escapeHtml(r.notes)}</p>` : ''}
              ${stationsHtml}
            </div>
            <button type="button" data-idx="${idx}" class="btn-del px-2.5 py-1 text-xs font-bold text-red-400 bg-zinc-950 border border-zinc-800 rounded-lg shrink-0">
              Elimina
            </button>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.btn-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = Number(btn.getAttribute('data-idx'));
          races.splice(i, 1);
          saveRaces();
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    function openApp(labelText, userKey) {
      currentUserKey = userKey || 'demo';
      document.getElementById('athlete-label').textContent = labelText;
      document.getElementById('race-date').value = new Date().toISOString().slice(0, 10);
      syncPresetOptions();
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      appScreen.classList.add('flex');
      loadRaces();
    }

    categorySelect.addEventListener('change', syncPresetOptions);
    presetSelect.addEventListener('change', updateCustomNamePlaceholder);

    document.getElementById('btn-add-station').addEventListener('click', () => {
      addStationRow();
    });

    tabLogin.addEventListener('click', () => {
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      tabLogin.className = 'py-2 rounded-lg text-xs font-bold bg-zinc-800 text-white';
      tabRegister.className = 'py-2 rounded-lg text-xs font-bold text-zinc-400';
    });

    tabRegister.addEventListener('click', () => {
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      tabRegister.className = 'py-2 rounded-lg text-xs font-bold bg-zinc-800 text-white';
      tabLogin.className = 'py-2 rounded-lg text-xs font-bold text-zinc-400';
    });

    document.getElementById('btn-demo').addEventListener('click', () => {
      openApp('Modalità Demo', 'demo');
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('reg-msg');
      msg.className = 'text-xs text-zinc-400';
      msg.textContent = 'Creazione account...';
      msg.classList.remove('hidden');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!sb) {
        openApp(name || email, email);
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      });

      if (error) {
        msg.className = 'text-xs text-red-400';
        msg.textContent = error.message;
        return;
      }

      if (data && data.session) {
        openApp(name || email, data.user.id);
      } else {
        msg.className = 'text-xs text-emerald-400';
        msg.textContent = 'Account creato! Ora puoi accedere dalla scheda Accedi.';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-msg');
      msg.className = 'text-xs text-red-400';
      msg.classList.add('hidden');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!sb) {
        openApp(email, email);
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message;
        msg.classList.remove('hidden');
        return;
      }

      const fullName = (data.user && data.user.user_metadata && data.user.user_metadata.full_name) || email;
      openApp(fullName, (data.user && data.user.id) || email);
    });

    document.getElementById('race-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const category = categorySelect.value;
      const preset = presetSelect.value;
      const customName = customNameInput.value.trim();

      const isPlaceholderPreset = preset.toLowerCase().includes('scrivi') || preset.toLowerCase().includes('inserisci');
      const finalTitle = customName || (!isPlaceholderPreset ? preset : category);

      if (!finalTitle) return;

      races.unshift({
        title: finalTitle,
        category,
        preset,
        date: document.getElementById('race-date').value,
        km: document.getElementById('race-km').value.trim(),
        time: document.getElementById('race-time').value.trim(),
        notes: document.getElementById('race-notes').value.trim(),
        stations: collectStations()
      });

      saveRaces();
      customNameInput.value = '';
      document.getElementById('race-km').value = '';
      document.getElementById('race-time').value = '';
      document.getElementById('race-notes').value = '';
      resetStationRows();
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      try { if (sb) await sb.auth.signOut(); } catch (e) {}
      appScreen.classList.add('hidden');
      appScreen.classList.remove('flex');
      authScreen.classList.remove('hidden');
    });

    syncPresetOptions();
  </script>
</body>
</html>
