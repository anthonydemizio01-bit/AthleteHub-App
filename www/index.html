<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AthleteHub — Registro Gare Multisport & Profilo Atleta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="auth-screen" class="min-h-screen flex flex-col justify-between p-4 sm:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/30 via-zinc-950 to-zinc-950">
    <div class="max-w-6xl w-full mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg class="w-6 h-6 text-zinc-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0" />
          </svg>
        </div>
        <span class="text-xl font-black tracking-tight text-white">Athlete<span class="text-emerald-400">Hub</span></span>
      </div>
    </div>

    <div class="max-w-md w-full mx-auto my-8 bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <h1 class="text-2xl sm:text-3xl font-black text-white">Il tuo Passaporto Sportivo</h1>
        <p class="text-xs sm:text-sm text-zinc-400">Traccia le tue gare in un unico posto.</p>
      </div>

      <div class="grid grid-cols-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button id="auth-tab-login" onclick="switchAuthMode('login')" class="py-2 rounded-lg text-xs font-bold bg-zinc-800 text-white transition">Accedi</button>
        <button id="auth-tab-register" onclick="switchAuthMode('register')" class="py-2 rounded-lg text-xs font-bold text-zinc-400 hover:text-white transition">Crea Account</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email *</label>
          <input type="email" id="login-email" required placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password *</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="login-error" class="text-xs text-red-400 hidden"></p>
        <button type="submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 shadow-lg shadow-emerald-500/20 transition">
          Entra in AthleteHub →
        </button>
      </form>

      <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nome e Cognome *</label>
          <input type="text" id="reg-name" required placeholder="es. Marco Rossi" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Email *</label>
          <input type="email" id="reg-email" required placeholder="atleta@esempio.it" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Password (min. 6 caratteri) *</label>
          <input type="password" id="reg-password" minlength="6" required placeholder="Crea una password sicura" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:border-emerald-500 focus:outline-none" />
        </div>
        <p id="reg-error" class="text-xs text-red-400 hidden"></p>
        <button type="submit" class="w-full py-3 rounded-xl text-sm font-extrabold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 shadow-lg shadow-emerald-500/20 transition">
          Crea Account Gratuito
        </button>
      </form>

      <button onclick="loginAsDemo()" class="w-full py-2.5 rounded-xl text-xs font-bold bg-zinc-950 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 transition">
        🚀 Prova Subito (Account Demo)
      </button>
    </div>
    <div></div>
  </div>

  <div id="app-wrapper" class="hidden min-h-screen flex-col">
    <header class="border-b border-zinc-800 bg-zinc-950/90 p-4 flex justify-between items-center">
      <span class="text-xl font-black text-white">Athlete<span class="text-emerald-400">Hub</span></span>
      <button onclick="logout()" class="px-3 py-1.5 text-xs font-bold bg-zinc-900 text-red-400 rounded-lg border border-zinc-800">Esci</button>
    </header>
    <main class="p-6 max-w-4xl mx-auto w-full">
      <h2 class="text-2xl font-bold text-white mb-4">Benvenuto in AthleteHub!</h2>
      <p class="text-zinc-400">Il database cloud è collegato correttamente.</p>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://syddlnewhenkofwwhimm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ya2A9O1zoIR4tIKsC3zm8w_vRrcEHxk';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function switchAuthMode(mode) {
      if (mode === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        document.getElementById('reg-error').textContent = error.message;
        document.getElementById('reg-error').classList.remove('hidden');
        return;
      }
      alert('Registrazione completata! Ora puoi effettuare l\'accesso.');
      switchAuthMode('login');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-error').textContent = 'Email o password errati.';
        document.getElementById('login-error').classList.remove('hidden');
        return;
      }
      startApp();
    }

    function loginAsDemo() {
      startApp();
    }

    function startApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-wrapper').classList.remove('hidden');
      document.getElementById('app-wrapper').classList.add('flex');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById('app-wrapper').classList.add('hidden');
      document.getElementById('app-wrapper').classList.remove('flex');
      document.getElementById('auth-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
